name: iOS Duo probe

# Measures how the app's layout behaves on the iPhone Duo simulator so the
# Duo plan (docs/ios-iphone-duo-plan.md §1.3) can replace estimates with facts:
# simulator/device-type discovery, iOS 27.1 SDK API declarations, and a layout
# probe (DuoProbeTests) that records point sizes, size classes, safe areas and
# system bar placement, with screenshots. Everything lands in one artifact.
#
# Simulator only: no signing secrets, no Supabase backend. Run it manually from
# the Actions tab; pushes to the ios-duo-probe branch also run it while the
# probe is being developed.

on:
  workflow_dispatch:
  push:
    branches: [ios-duo-probe]
    paths:
      - "iOS/**"
      - "scripts/duo-probe/**"
      - ".github/workflows/ios-duo-probe.yml"

concurrency:
  group: ios-duo-probe
  cancel-in-progress: true

jobs:
  probe:
    # Only the Xcode 27 image carries the iOS 27.1 runtime with the iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iOS/FinancialManagement
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          xcode="$(ls -d /Applications/Xcode_27.1*.app | head -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "OUT=$RUNNER_TEMP/duo-probe" >> "$GITHUB_ENV"

      - name: Discover simulator and Duo controls
        run: bash ../../scripts/duo-probe/discover.sh "$OUT/discovery"

      - name: Report iOS 27.1 SDK API declarations
        run: bash ../../scripts/duo-probe/sdk-apis.sh "$OUT/sdk-apis.txt"

      - name: Run layout probe
        run: bash ../../scripts/duo-probe/run-probe.sh "$OUT/probe"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## iPhone Duo probe"
            echo '```'
            cat "$OUT/discovery/device.txt" 2>/dev/null
            cat "$OUT/discovery/io-enumerate.txt" 2>/dev/null
            echo '```'
            for f in "$OUT"/probe/*/*.json; do
              [ -f "$f" ] || continue
              echo "### $(basename "$(dirname "$f")")/$(basename "$f")"
              echo '```json'
              jq -c '{window, windowSafeArea, traits}' "$f" 2>/dev/null || head -c 2000 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-probe
          path: ${{ runner.temp }}/duo-probe
          if-no-files-found: warn
