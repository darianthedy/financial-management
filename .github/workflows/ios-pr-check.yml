name: iOS PR check

# T1 of the iPhone Duo CI plan (docs/ios-iphone-duo-implementation-plan.md §1):
# one build-for-testing, then every unit + layout test in the FinancialManagement
# test bundle on the iPhone Duo simulator. Target: ≤ 10 min.
#
# - XCUITests (FinancialManagementUITests) are excluded; they run at gate G4/T3.
# - Drafts and doc-only changes skip, and a new push cancels the stale run.
# - Simulator only: no signing secrets, no Supabase backend.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "iOS/**"
      - "!iOS/**/*.md"
      - "scripts/ios-ci/**"
      - ".github/workflows/ios-pr-check.yml"
  workflow_dispatch:

concurrency:
  group: ios-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # Only the Xcode 27 image carries the iOS 27.1 runtime with the iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS/FinancialManagement
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to date each file by its last commit (below).
          fetch-depth: 0

      # A fresh checkout stamps every file "now", which makes a cached
      # DerivedData recompile everything. Give each file under iOS/ its last
      # commit's time instead, so only files changed since the cache rebuild.
      - name: Restore file times
        working-directory: ${{ github.workspace }}
        run: |
          git log --format='T %ct' --name-only -- iOS | python3 -c '
          import os, sys
          seen, t = set(), 0
          for line in sys.stdin:
              line = line.rstrip("\n")
              if line.startswith("T "):
                  t = int(line[2:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.isfile(line):
                      os.utime(line, (t, t))
          print(f"dated {len(seen)} paths")'

      - name: Select Xcode 27.1
        run: |
          xcode="$(ls -d /Applications/Xcode_27.1*.app | head -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Cache the Swift package checkouts (Supabase and friends), keyed on the
      # lockfile.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iOS/FinancialManagement/FinancialManagement.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # DerivedData is fragile across Xcode builds, so its key is the exact
      # `xcodebuild -version` plus the lockfile, with no fallback keys; one
      # that fails to build is discarded for a clean build (pr-check.sh).
      - name: Key DerivedData
        id: dd-key
        run: echo "key=dd-${{ runner.os }}-$(xcodebuild -version | shasum -a 256 | cut -c1-16)-${{ hashFiles('iOS/FinancialManagement/FinancialManagement.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore DerivedData
        id: dd
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pr-dd
          key: ${{ steps.dd-key.outputs.key }}

      - name: Build and test
        env:
          DD_RESTORED: ${{ steps.dd.outputs.cache-hit }}
        run: bash ../../scripts/ios-ci/pr-check.sh "$RUNNER_TEMP/pr-check"

      - name: Trim DerivedData
        if: success() && steps.dd.outputs.cache-hit != 'true'
        run: rm -rf "$RUNNER_TEMP/pr-dd/Logs" "$RUNNER_TEMP/pr-dd/Index.noindex" && du -sh "$RUNNER_TEMP/pr-dd"

      - name: Save DerivedData
        if: success() && steps.dd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pr-dd
          key: ${{ steps.dd-key.outputs.key }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "## iOS PR check"
            echo '```'
            cat "$RUNNER_TEMP/pr-check/summary.txt" 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pr-check
          path: |
            ${{ runner.temp }}/pr-check/*.log
            ${{ runner.temp }}/pr-check/*.xcresult
          if-no-files-found: ignore
